name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint and Test
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          flake8 calculator.py --max-line-length=100 || echo "Lint warnings"
          python calculator.py
          echo "Tests passed"
